
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isabella Karlsson | Growth & Marketing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #ff0080;
      --black: #050505;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    /* BACKGROUND GLOW */

    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: var(--pink);
      filter: blur(120px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }

    .glow-top {
      top: -300px;
      left: -200px;
    }

    .glow-bottom {
      right: -250px;
      bottom: -250px;
    }

    /* NAVIGATION */

    header {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 24px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -3px;
      text-decoration: none;
      color: white;
    }

    nav {
      display: flex;
      gap: 45px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: var(--pink);
    }

    nav a.active {
      border-bottom: 2px solid white;
      padding-bottom: 5px;
    }

    .connect {
      background: var(--pink);
      padding: 14px 25px;
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      transition: 0.3s;
    }

    .connect:hover {
      background: white;
      color: black;
      transform: scale(1.05);
    }

    /* HERO */

    .hero {
      min-height: calc(100svh - 86px);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 50px 3% 125px;
      overflow: hidden;
      isolation: isolate;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(110px, 18vw, 300px);
      line-height: 0.77;
      letter-spacing: -0.035em;
      color: var(--pink);
      text-transform: uppercase;
    }

    .isabella {
      text-align: left;
      animation: slideLeft 1.2s ease both;
    }

    .karlsson {
      text-align: right;
      margin-top: 15px;
      animation: slideRight 1.2s ease both;
    }

    /* INTRO */

    .intro {
      max-width: 390px;
      margin-top: 35px;
      margin-left: 2%;
      animation: fadeIn 1.6s ease both;
    }

    .intro p {
      font-size: 21px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .work-btn {
      display: inline-flex;
      gap: 20px;
      align-items: center;
      padding: 13px 30px;
      border: 1.5px solid white;
      border-radius: 50px;
      text-decoration: none;
      color: white;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .work-btn:hover {
      background: var(--pink);
      border-color: var(--pink);
      transform: translateY(-4px);
    }

    /* MOVING BANNER */

    .ticker {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 90px;
      background: var(--pink);
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 3;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: marquee 20s linear infinite;
    }

    .ticker-content {
      display: flex;
      align-items: center;
      gap: 80px;
      padding-right: 80px;
      white-space: nowrap;
      font-family: "Barlow Condensed", sans-serif;
      font-style: italic;
      font-weight: 600;
      font-size: 35px;
      letter-spacing: 10px;
    }

    /* ANIMATIONS */

    @keyframes slideLeft {
      from {
        opacity: 0;
        transform: translateX(-100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideRight {
      from {
        opacity: 0;
        transform: translateX(100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes marquee {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /* RESPONSIVE */

    @media (max-width: 768px) {
      header {
        padding: 20px 5%;
        flex-wrap: wrap;
        gap: 18px;
      }

      nav {
        order: 3;
        width: 100%;
        justify-content: space-between;
        gap: 10px;
      }

      nav a {
        font-size: 12px;
      }

      .connect {
        padding: 12px 16px;
        font-size: 12px;
      }

      .hero {
        min-height: calc(100svh - 120px);
        padding: 60px 5% 115px;
      }

      .name {
        font-size: clamp(65px, 17vw, 140px);
        line-height: 0.9;
      }

      .karlsson {
        margin-top: 20px;
      }

      .intro {
        margin-top: 50px;
        margin-left: 0;
      }

      .intro p {
        font-size: 17px;
      }

      .ticker {
        height: 70px;
      }

      .ticker-content {
        font-size: 25px;
        letter-spacing: 6px;
      }

      .glow {
        width: 280px;
        height: 280px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="#" class="logo">IK</a>

    <nav>
      <a href="#" class="active">HOME</a>
      <a href="#work">WORK</a>
      <a href="#about">ABOUT</a>
      <a href="mailto:hello@example.com">CONTACT</a>
    </nav>

    <a href="mailto:hello@example.com" class="connect">
      LET'S CONNECT ↗
    </a>
  </header>

  <main>
    <section class="hero" id="home">

      <div class="glow glow-top"></div>
      <div class="glow glow-bottom"></div>

      <div class="hero-content">

        <h1 class="name isabella">ISABELLA</h1>
        <h1 class="name karlsson">KARLSSON</h1>

        <div class="intro">
          <p>
            Growth marketing student with a focus on
            marketing, growth and brand development.
          </p>

          <a href="#work" class="work-btn">
            VIEW WORK ↗
          </a>
        </div>

      </div>

      <div class="ticker">
        <div class="ticker-track">

          <div class="ticker-content">
            <span>GROWTH</span>
            <span>/</span>
            <span>MARKETING</span>
            <span>/</span>
          </div>

          <div class="ticker-content" aria-hidden="true">
            <span>GROWTH</span>
            <span>/</span>
            <span>MARKETING</span>
            <span>/</span>
          </div>

        </div>
      </div>

    </section>
  </main>

</body>
</html>
